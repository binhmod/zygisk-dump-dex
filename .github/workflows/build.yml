name: Build Dump Dex Payload (ctor)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Payload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-linux-android
          override: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build payload (release)
        run: cargo ndk -t arm64-v8a --platform=29 build --release

      - name: Rename output for Zygisk-Loader convention
        run: |
          mkdir -p out
          cp target/aarch64-linux-android/release/libdump_dex_payload.so out/payload_dumpdex.so
          ls -la out/

      - name: Upload built payload
        uses: actions/upload-artifact@v4
        with:
          name: payload_dumpdex
          path: out/payload_dumpdex.so
