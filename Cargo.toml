[package]
name = "dump_dex_payload"
version = "0.1.0"
edition = "2021"

[lib]
name = "dump_dex_payload"
crate-type = ["cdylib"]

[dependencies]
# Giữ nguyên version các dependency đã xác nhận resolve OK từ Cargo.lock
# trước đó (bản dùng zygisk-rs), để tránh version conflict mới phát sinh.
android_logger = "0.14.1"
anyhow = "1.0"
crc = "3.4.0"
dobby-rs = "0.1.0"
jni-sys = "0.3.0"
log = "0.4.29"

# THÊM MỚI: ctor để thay thế register_zygisk_module!/Module trait.
# Ghim version 0.2.x — cú pháp #[ctor] đơn giản (không cần #[ctor(unsafe)])
# đã ổn định lâu và đây cũng là version README của Zygisk-Loader dùng làm
# ví dụ mẫu, giảm rủi ro lệch cú pháp macro giữa các major version.
ctor = "0.2"

[profile.release]
# Giữ debug info tối thiểu để log panic (nếu có) còn đọc được, nhưng
# vẫn strip phần lớn để giữ kích thước file nhỏ — quan trọng vì
# Zygisk-Loader dùng memfd injection, file lớn có thể ảnh hưởng tốc độ
# inject.
panic = "unwind"
opt-level = 2
